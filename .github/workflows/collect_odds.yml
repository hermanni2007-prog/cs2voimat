name: CS2 odds collector

on:
  # VALIAIKAISESTI POIS PAALTA (2026-09-17): /v4/account paljasti etta
  # OddsPapin ilmainen taso on 250 PYYNTOA/KUUKAUSI, ei paivassa. 20 min
  # pollausvali (3 pyyntoa/ajo) olisi polttanut koko kuukauden kiintion
  # alle vuorokaudessa. Ajetaan vain kasin (workflow_dispatch) kunnes
  # pollausstrategia on suunniteltu uudelleen kiintion sisalle.
  # - schedule:
  #     - cron: "*/20 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: cs2-odds-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - name: Aja keruu
        env:
          ODDSPAPI_API_KEY: ${{ secrets.ODDSPAPI_API_KEY }}
          CLOSING_WINDOW_MINUTES: "25"
          ODDSPAPI_BOOKMAKERS: "pinnacle"
        run: python src/collect_odds.py

      - name: Committaa tietokanta ja valimuisti takaisin repoon
        run: |
          git config user.name "cs2-odds-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/odds.db data/cache_sport_id.json data/cache_tournaments.json data/cache_participants.json
          git diff --cached --quiet || git commit -m "collector: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push
