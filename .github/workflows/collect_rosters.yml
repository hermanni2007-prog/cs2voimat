name: CS2 roster collector

on:
  schedule:
    # Paivittain - kokoonpanot muuttuvat harvoin, ei tarvitse 15 min tarkkuutta.
    - cron: "23 4 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: cs2-roster-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - name: Aja kokoonpanokeruu (taysi paivitys, ~50 joukkuetta, ~25 min)
        run: python src/collect_rosters.py --reset

      - name: Committaa tietokanta ja edistymistiedosto takaisin repoon
        # HUOM 2026-09-20: ks. collect_history.yml:n saman kohdan kommentti -
        # sama binaarikonflikti-uusintayritys+siisti-luovutus -logiikka.
        run: |
          git config user.name "cs2-roster-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/odds.db data/roster_progress.json
          git diff --cached --quiet || git commit -m "roster collector: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          for i in 1 2 3 4 5; do
            git fetch origin main
            if git rebase origin/main && git push origin main; then
              echo "Push onnistui (yritys $i)."
              exit 0
            fi
            git rebase --abort >/dev/null 2>&1 || true
            sleep $((RANDOM % 10 + 3))
          done
          echo "Push epaonnistui $i yrityksen jalkeen (binaarikonflikti toisen collectorin kanssa) - luovutaan taman ajon omasta datasta siististi, seuraava ajo yrittaa uudelleen."
          git reset --hard origin/main
          exit 0
