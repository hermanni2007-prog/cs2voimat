name: CS2 map/bracket collector

on:
  schedule:
    # Sama tasa-ajon valttely kuin collect_history.yml:ssa, eri minuutti
    # ettei molemmat ajastukset osu samaan hetkeen.
    - cron: "9,24,39,54 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: cs2-maps-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - name: Aja karttakeruu (max 20 turnausta / ajo)
        run: python src/collect_maps.py --max-tournaments 20

      - name: Committaa tietokanta ja edistymistiedosto takaisin repoon
        run: |
          git config user.name "cs2-maps-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/odds.db data/maps_progress.json
          git diff --cached --quiet || git commit -m "maps collector: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git pull --rebase origin main
          git push
