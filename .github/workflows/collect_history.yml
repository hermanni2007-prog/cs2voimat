name: CS2 history collector

on:
  schedule:
    # 15 min valein, mutta SIIRRETTY pois tasa-ajoista (:00/:15/:30/:45).
    # GitHubin oma dokumentaatio varoittaa: "the schedule event can be
    # delayed during periods of high load - high load times include the
    # start of every hour [ja vastaavat tasavalit]." Alkuperainen "*/15"
    # osui juuri naihin - havaittu 2026-09-17: 0 ajoa 1,5 h:ssa vaikka
    # YAML oli validi. Liquipedian action=parse sallii 1 pyynnon/30s, joten
    # 25 joukkuetta/ajo (~12.5 min) mahtuu turvallisesti 15 min ikkunaan.
    - cron: "6,21,36,51 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: cs2-history-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - name: Aja historiakeruu (max 25 joukkuetta / ajo)
        run: python src/collect_history.py --max-teams 25

      - name: Putken jarkevyystarkistus (ei pysayta committia, vain nakyviin lokiin)
        run: python src/check_pipeline_health.py || true

      - name: Committaa tietokanta ja edistymistiedosto takaisin repoon
        # HUOM 2026-09-20 (kayttajan raportoima "GitHub sanoo koko ajan
        # erroria" -ongelma): data/odds.db on binaaritiedosto jota TAMA,
        # collect_maps.yml, collect_rosters.yml JA paikalliset manuaaliset
        # pushit kaikki koskettavat - alkuperainen "git pull --rebase ||
        # git push" ilman virheenkasittelya kaatui HETI kun kaksi ajoa
        # osuivat paallekkain (rebase-konflikti binaaritiedostossa ei
        # ratkea itsestaan, koko askel epaonnistui = punainen ajo). Nyt:
        # muutama uusintayritys satunnaisella odotuksella (valttaa "thundering
        # herd" muiden collectoreiden kanssa), ja jos EI silti onnistu,
        # LUOVUTAAN TAMAN AJON OMASTA datasta siististi (exit 0, ei punaista
        # ajoa) - seuraava ajo 15 min paasta yrittaa niiden joukkueiden/
        # turnausten kanssa uudelleen (status jai 'ok' vain paikallisessa
        # checkoutissa, ei origin/mainissa, joten ne eivat "katoa" pysyvasti).
        run: |
          git config user.name "cs2-history-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/odds.db data/history_progress.json
          git diff --cached --quiet || git commit -m "history collector: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          for i in 1 2 3 4 5; do
            git fetch origin main
            if git rebase origin/main && git push origin main; then
              echo "Push onnistui (yritys $i)."
              exit 0
            fi
            git rebase --abort >/dev/null 2>&1 || true
            sleep $((RANDOM % 10 + 3))
          done
          echo "Push epaonnistui $i yrityksen jalkeen (binaarikonflikti toisen collectorin kanssa) - luovutaan taman ajon omasta datasta siististi, seuraava ajo yrittaa uudelleen."
          git reset --hard origin/main
          exit 0
