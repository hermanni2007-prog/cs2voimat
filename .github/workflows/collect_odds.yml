name: CS2 odds collector

on:
  # VALIAIKAISESTI POIS PAALTA (2026-09-17): odotetaan etta Coolbet + Dev
  # (100 000 pyyntoa/kk) -tilaus on vahvistettu oddspapi.io:ssa. Nykyinen
  # avain on viela ilmaisella 250/kk-tasolla - AJASTUSTA EI SAA PAALLE
  # ennen kuin tilaus on aktiivinen, tai kiintio palaa loppumaan alle
  # vuorokaudessa niin kuin ensimmaisella kerralla.
  #
  # Kun tilaus on vahvistettu: poista kommentit alta. 5 min pollausvali x
  # ~3-4 pyyntoa/ajo x 288 ajoa/vrk on n. 30 000/kk - reilusti 100 000:n
  # kiintion sisalla. Minuutit siirretty pois tasa-ajoista (2,7,12...) -
  # GitHub varoittaa itse etta tasatunnit/-vartit ruuhkautuvat ja voivat
  # viivastyttaa laukaisua, ks. collect_history.yml:n havainto 2026-09-17.
  # - schedule:
  #     - cron: "2,7,12,17,22,27,32,37,42,47,52,57 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: cs2-odds-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - name: Aja keruu
        env:
          ODDSPAPI_API_KEY: ${{ secrets.ODDSPAPI_API_KEY }}
          CLOSING_WINDOW_MINUTES: "10"
          ODDSPAPI_BOOKMAKERS: "coolbet"
        run: python src/collect_odds.py

      - name: Committaa tietokanta ja valimuisti takaisin repoon
        run: |
          git config user.name "cs2-odds-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/odds.db data/cache_sport_id.json data/cache_tournaments.json data/cache_participants.json
          git diff --cached --quiet || git commit -m "collector: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git pull --rebase origin main
          git push
